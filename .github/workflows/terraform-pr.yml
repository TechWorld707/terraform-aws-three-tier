name: Terraform pull-request validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "**/*.tf"
      - "**/*.tftest.hcl"
      - "**/.terraform.lock.hcl"
      - ".github/workflows/terraform-pr.yml"

permissions:
  contents: read

concurrency:
  group: terraform-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TERRAFORM_VERSION: "1.14.3"

jobs:
  formatting:
    name: Terraform formatting
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

  validate:
    name: Validate ${{ matrix.environment }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        environment:
          - dev
          - staging
          - production

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Initialize without remote backend
        run: terraform -chdir=environments/${{ matrix.environment }} init -backend=false

      - name: Validate configuration
        run: terraform -chdir=environments/${{ matrix.environment }} validate

  module-tests:
    name: Test ${{ matrix.module }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        module:
          - vpc
          - security
          - ecs
          - rds
          - redis
          - storage
          - runtime
          - edge
          - monitoring
          - backup

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Initialize module
        run: terraform -chdir=modules/${{ matrix.module }} init -backend=false

      - name: Run native Terraform tests
        run: terraform -chdir=modules/${{ matrix.module }} test

  tflint:
    name: TFLint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest

      - name: Initialize TFLint
        run: tflint --init

      - name: Lint Terraform
        run: tflint --recursive --minimum-failure-severity=error
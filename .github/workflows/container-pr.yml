name: Backend container pull-request validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - "database/migrations/**"
      - ".dockerignore"
      - ".github/workflows/container-pr.yml"

permissions:
  contents: read

concurrency:
  group: container-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  IMAGE_NAME: three-tier-backend
  IMAGE_TAG: pr-${{ github.event.pull_request.number }}

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install test dependencies
        working-directory: backend
        run: python -m pip install --requirement requirements-dev.txt

      - name: Run backend tests
        run: python -m pytest backend/tests

  container-build-and-scan:
    name: Build and scan backend image
    runs-on: ubuntu-latest
    needs:
      - backend-tests

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

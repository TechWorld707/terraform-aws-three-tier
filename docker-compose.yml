services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: profiles
      POSTGRES_USER: app
      POSTGRES_PASSWORD: local-only
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro  
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d profiles"]
      interval: 3s
      timeout: 3s
      retries: 10
  redis:
    image: redis:8-alpine
  backend:
    build: ./backend
    ports: ["8081:8080"]
    environment:
      DATABASE_URL: postgresql+psycopg://app:local-only@db:5432/profiles
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
  frontend:
    build: ./frontend
    ports: ["3001:8080"]
    depends_on: [backend]
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
volumes:
  postgres_data:
